
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo_Drive | تسجيل الدخول</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-page">

        <section class="visual-side">
            <div class="visual-overlay"></div>
            <div class="visual-caption">
                <span>PREMIUM CAR SHOWROOM</span>
                <h1>Drive Your Dreams</h1>
                <p>إدارة أذكى لمعرض سياراتك</p>
            </div>
        </section>

        <section class="form-side">
            <div class="login-card">

                <div class="mobile-brand">
                    <span>TD</span>
                    <strong>Turbo_Drive</strong>
                </div>

                <div class="card-heading">
                    <p class="welcome">مرحبًا بك في</p>
                    <h1>Turbo_Drive</h1>
                    <p class="subtitle">إدارة مرض السيارات بذكاء</p>
                </div>

                <form id="loginForm" autocomplete="off">

                    <div class="input-group">
                        <label for="username">اسم المستخدم</label>
                        <div class="input-wrap">
                            <span class="field-icon">♙</span>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="أدخل اسم المستخدم"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">كلمة المرور</label>
                        <div class="input-wrap">
                            <span class="field-icon">♙</span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="أدخل كلمة المرور"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="show-password" id="togglePassword" aria-label="إظهار كلمة المرور">
                                ◉
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" id="rememberMe">
                            <span>تذكرني</span>
                        </label>

                        <a href="#" id="forgotPassword">نسيت كلمة المرور؟</a>
                    </div>

                    <button type="submit" class="login-button" id="loginButton">
                        <span id="buttonText">دخول</span>
                        <span class="button-arrow">←</span>
                    </button>

                    <p id="loginMessage" class="login-message" role="alert"></p>

                </form>

                <div class="card-footer">
                    <div class="footer-divider">
                        <span></span>
                        <b>🚘</b>
                        <span></span>
                    </div>
                    <p>Drive Your Dreams</p>
                </div>

            </div>
        </section>

    </main>

    <script src="js/login.js"></script>
</body>
</html>
